services:
  gowireshark:
    image: gowireshark:latest
    platform: linux/amd64
    build:
      context: .
      platforms:
        - linux/amd64
    scale: 3
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - PCAP_BASE_DIR=/app/pcaps
    volumes:
      - ./pcaps:/app/pcaps:ro
    expose:
      - "8090"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "18090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gowireshark
    restart: unless-stopped

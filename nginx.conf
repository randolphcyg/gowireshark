events {
    worker_connections 1024;
}

http {
    upstream gowireshark {
        # Docker Compose DNS resolves to all replicas automatically
        server gowireshark:8090;
    }

    server {
        listen 18090;

        # Health check for the LB itself
        location /health {
            proxy_pass http://gowireshark;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location / {
            proxy_pass http://gowireshark;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;    # Long timeout for large file parsing
            proxy_send_timeout 300s;
            proxy_buffering off;        # Required for NDJSON streaming
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
